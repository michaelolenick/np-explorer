# Requests nginx answered 429 (rate or connection limit), from /var/log/nginx/np-limited.log:
#   203.0.113.9 [17/Oct/2026:11:00:00 +0000] "GET /search?q=x HTTP/2.0" 429 "curl/8.5.0"
[Definition]
failregex = ^<HOST> \[[^\]]+\] "[^"]*" 429 
ignoreregex =
datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S %%z
