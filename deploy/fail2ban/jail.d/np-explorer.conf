# strategystudio.org: ban an IP from the web ports for an hour after 20 rate-limited
# requests (nginx 429s) in 5 minutes. Installed at /etc/fail2ban/jail.d/np-explorer.conf.

# The Debian package enables an SSH jail by default; SSH is managed separately, so it stays off.
[sshd]
enabled = false

[np-ratelimit]
enabled   = true
filter    = np-ratelimit
logpath   = /var/log/nginx/np-limited.log
backend   = auto
port      = http,https
maxretry  = 20
findtime  = 5m
bantime   = 1h
# Never ban ourselves: localhost and this VM (public and private addresses).
ignoreip  = 127.0.0.1/8 ::1 20.168.8.141 10.1.0.4
