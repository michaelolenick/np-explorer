# Abuse protection for furp.org (http context: /etc/nginx/conf.d/np-limits.conf).
# The server block applies these; see deploy/nginx/furp.org.

# Search-engine crawlers, by the IP ranges Google and Bing publish (not by user agent,
# which anyone can fake). /etc/nginx/np-crawlers.conf is written weekly by
# scripts/update_crawler_ips.py. Crawlers skip the per-visitor limits below and get
# their own, much higher one, so they can crawl the sitemap (tens of millions of pages).
geo $np_crawler {
    default 0;
    include /etc/nginx/np-crawlers.conf;
}

# Person popups (/person/N?fragment=1, prefetched on hover) count against the page
# limit, not the search/person limit; an empty key means "not counted by this zone".
# The key is "<crawler><fragment>": "1..." is a crawler, "01" a visitor's popup.
map "$np_crawler$arg_fragment" $np_heavy_key {
    "~^1"   "";
    "01"    "";
    default $binary_remote_addr;
}
map "$np_crawler$arg_fragment" $np_frag_key {
    "01"    $binary_remote_addr;
    default "";
}
map $np_crawler $np_pages_key {
    1       "";
    default $binary_remote_addr;
}
map $np_crawler $np_crawl_key {
    1       $binary_remote_addr;
    default "";
}

# Search and person pages: 30 a minute per IP (burst 10). Other dynamic pages: 120 a minute (zone np_dynamic;
# renamed from np_pages when its key changed, since nginx can't change a zone's key on reload).
# Crawlers: 600 a minute per IP (burst 200) on every dynamic page.
limit_req_zone $np_heavy_key        zone=np_heavy:10m rate=30r/m;
limit_req_zone $np_frag_key         zone=np_frag:10m  rate=120r/m;
limit_req_zone $np_pages_key        zone=np_dynamic:10m rate=120r/m;
limit_req_zone $np_crawl_key        zone=np_crawl:10m rate=600r/m;
limit_conn_zone $binary_remote_addr zone=np_conn:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

# Empty user agents and a short list of abusive scrapers (never search engines or browsers).
map $http_user_agent $np_block_ua {
    default 0;
    include /etc/nginx/np-bad-agents.conf;
}

# A Referer of exactly the bare origin ("https://furp.org": no slash, no path) comes from no browser (they send
# "https://furp.org/" or the page's URL) and no search engine. On 2026-11-04 a distributed scraper (thousands of
# IPs, browser user agents, 15,000 requests a minute) sent exactly that on every request; refused with 403 like
# the bad agents above, so nothing reaches the app and fail2ban never sees it.
map $http_referer $np_block_ref {
    default 0;
    "https://furp.org" 1;
    "http://furp.org"  1;
}

# 2026-11-12: the same scraper came back with an empty Referer: about 11,000 IPs, 6,000 requests a minute, every one
# a person page over HTTP/1.1 with a Macintosh Chrome, Edge or Firefox user agent. Two requests an IP, so the per-IP
# limits never saw it, and it filled every app worker and database connection: the home page took 25 seconds.
# Requests of that shape (a person page, no Referer, a Macintosh browser agent, not a search-engine range) share ONE
# budget of 2 a second; the rest get nginx's 429 page and never reach the app. Anyone who follows a link from a page,
# a search engine or an app that sends a Referer is untouched; a Mac visitor who pastes a person URL into the
# address bar shares the budget. The key is "crawler|referer|uri|agent"; the regex avoids backslashes on purpose.
map "$np_crawler|$http_referer|$uri|$http_user_agent" $np_scrape_key {
    "~^0[|][|]/person/[^|]*[|]Mozilla/5[.]0 [(]Macintosh" "scrape";
    default "";
}
limit_req_zone $np_scrape_key zone=np_scrape:1m rate=120r/m;

# Rate-limited requests also go to their own log (read by fail2ban and scripts/traffic.py).
# Crawlers' 429s are left out so fail2ban never bans a search engine.
map "$np_crawler$status" $np_limited {
    "0429"  1;
    default 0;
}
# Requests claiming to be Googlebot or Bingbot get their own log with timing, for the daily
# report (app/report.py checks each IP by reverse DNS; claims that fail count as fakes).
map $http_user_agent $np_bot_ua {
    default 0;
    "~*(googlebot|google-inspectiontool|bingbot|bingpreview)" 1;
}
log_format np_bots '$remote_addr [$time_local] "$request" $status $request_time "$http_user_agent"';
log_format np_limited '$remote_addr [$time_local] "$request" $status "$http_user_agent"';
